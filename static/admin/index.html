<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMx Music 管理后台</title>
<style>
:root {
  --bg: #0f0f0f;
  --bg-card: #1a1a1a;
  --bg-hover: #222;
  --primary: #6c5ce7;
  --primary-hover: #5a4bd1;
  --text: #e0e0e0;
  --text-muted: #999;
  --border: #2a2a2a;
  --danger: #e74c3c;
  --success: #27ae60;
  --radius: 10px;
  --max-w: 1000px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-hover); }

/* Login */
.login-screen {
  display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
}
.login-card h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: var(--primary); }
.login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.95rem; font-family: inherit;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }
.form-group textarea { min-height: 300px; resize: vertical; font-family: "Fira Code", monospace; font-size: 0.85rem; line-height: 1.5; }
.btn {
  display: inline-block; padding: 10px 24px; border: none; border-radius: 8px;
  font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #c0392b; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 14px; font-size: 0.8rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Nav */
.app-nav {
  position: sticky; top: 0; z-index: 100; background: rgba(15,15,15,0.94);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: var(--max-w); margin: 0 auto; padding: 0 24px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand { font-weight: 800; font-size: 1.1rem; color: var(--primary); letter-spacing: -0.5px; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
  color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  background: none; border: none; font-family: inherit;
}
.nav-tab:hover { color: var(--text); background: var(--bg-hover); }
.nav-tab.active { color: #fff; background: var(--primary); }
.nav-actions { display: flex; gap: 8px; align-items: center; }

/* Main */
.app-main { max-width: var(--max-w); margin: 0 auto; padding: 24px; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Toast */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;
  animation: slideIn 0.25s ease; min-width: 280px;
}
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.info { background: var(--primary); color: #fff; }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Cards */
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 24px; margin-bottom: 12px; transition: border-color 0.2s;
}
.card:hover { border-color: var(--primary); }
.card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.card-title { font-size: 1.05rem; font-weight: 700; }
.card-date { font-size: 0.8rem; color: var(--text-muted); }
.card-actions { display: flex; gap: 8px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; color: var(--text-muted); }
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Form */
.form-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px;
}
.form-card h2 { font-size: 1.3rem; margin-bottom: 20px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9998;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 32px; max-width: 440px; width: 100%; text-align: center;
}
.modal h3 { font-size: 1.15rem; margin-bottom: 12px; }
.modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }

/* Utility */
.mt-12 { margin-top: 12px; }
.mt-20 { margin-top: 20px; }
.text-muted { color: var(--text-muted); font-size: 0.85rem; }
.hidden { display: none !important; }

@media (max-width: 640px) {
  .login-card { padding: 28px 20px; }
  .form-card { padding: 20px; }
  .card-header { flex-direction: column; align-items: flex-start; }
  .nav-tabs { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>WMx Music 管理后台</h1>
    <p>输入 GitHub Personal Access Token 登录</p>
    <div class="form-group">
      <label>Personal Access Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    <button class="btn btn-primary btn-block" onclick="login()">登 录</button>
    <p class="text-muted mt-12">
      需要具备 repo 权限的 <a href="https://github.com/settings/tokens" target="_blank">GitHub Token</a>
    </p>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <nav class="app-nav">
    <div class="nav-inner">
      <span class="nav-brand">WMx Admin</span>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('works')">作品管理</button>
        <button class="nav-tab" onclick="switchTab('pages')">页面管理</button>
      </div>
      <div class="nav-actions">
        <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
      </div>
    </div>
  </nav>

  <div class="app-main">
    <!-- Works Tab -->
    <div id="tab-works" class="tab-content active">
      <div id="worksList">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
          <h2 style="font-size:1.3rem">作品列表</h2>
          <button class="btn btn-primary" onclick="showNewWorkForm()">+ 新建作品</button>
        </div>
        <div id="worksContainer"><div class="loading"><div class="spinner"></div></div></div>
      </div>
      <div id="workForm" class="hidden">
        <div class="form-card">
          <h2 id="workFormTitle">新建作品</h2>
          <div class="form-group">
            <label>标题</label>
            <input type="text" id="workTitle" placeholder="作品标题">
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="workDate">
          </div>
          <div class="form-group">
            <label>文件名 (slug)</label>
            <input type="text" id="workSlug" placeholder="自动生成或手动输入">
          </div>
          <div class="form-group">
            <label>正文 (Markdown，支持嵌入 B站/网易云 iframe)</label>
            <textarea id="workBody" placeholder="直接粘贴 Markdown 或 iframe 代码..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="btnSaveWork" onclick="saveWork()">保存</button>
            <button class="btn btn-outline" onclick="cancelWorkForm()">取消</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pages Tab -->
    <div id="tab-pages" class="tab-content">
      <h2 style="font-size:1.3rem;margin-bottom:16px">页面管理</h2>
      <div id="pagesContainer"><div class="loading"><div class="spinner"></div></div></div>
      <div id="pageForm" class="hidden mt-20">
        <div class="form-card">
          <h2 id="pageFormTitle">编辑页面</h2>
          <div class="form-group">
            <label>标题</label>
            <input type="text" id="pageTitle">
          </div>
          <div class="form-group">
            <label>正文 (Markdown)</label>
            <textarea id="pageBody"></textarea>
          </div>
          <input type="hidden" id="pagePath">
          <input type="hidden" id="pageSha">
          <div class="form-actions">
            <button class="btn btn-primary" onclick="savePage()">保存</button>
            <button class="btn btn-outline" onclick="cancelPageForm()">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Delete Confirm Modal -->
<div id="deleteModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>确认删除</h3>
    <p id="deleteMessage">确定要删除该作品吗？此操作不可撤销。</p>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btnConfirmDelete">确认删除</button>
      <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
    </div>
  </div>
</div>

<script>
const OWNER = 'wmxmusic';
const REPO = 'wmxmusic.github.io';
const BRANCH = 'master';
const API = `https://api.github.com`;
const WORKS_PATH = 'content/works';

let currentTab = 'works';
let editingFile = null; // { path, sha } for edit mode, null for new
let pendingDelete = null;
let currentPage = null; // { path, sha, title } for page editing

// --- Token ---
function getToken() { return localStorage.getItem('wmxtoken'); }
function saveToken(t) { localStorage.setItem('wmxtoken', t); }
function clearToken() { localStorage.removeItem('wmxtoken'); }

// --- API Helpers ---
async function api(url, opts = {}) {
  const token = getToken();
  if (!token) throw new Error('未登录');
  const res = await fetch(url, {
    ...opts,
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
  });
  if (res.status === 401) { logout(); throw new Error('Token 无效，请重新登录'); }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `API 错误: ${res.status}`);
  }
  return res;
}

// --- Toast ---
function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`; el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => { el.remove(); }, 3500);
}

// --- Login ---
async function login() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return toast('请输入 Token', 'error');
  saveToken(token);
  try {
    const res = await api(`${API}/user`);
    const user = await res.json();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    toast(`已登录: ${user.login}`, 'success');
    loadWorks();
    loadPages();
  } catch (e) {
    clearToken();
    toast('登录失败: ' + e.message, 'error');
  }
}

function logout() {
  clearToken();
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}

// Auto login
if (getToken()) {
  api(`${API}/user`).then(res => res.json()).then(user => {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadWorks(); loadPages();
  }).catch(() => { clearToken(); });
}

// --- Tab Switch ---
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach((t, i) => t.classList.toggle('active', (i === 0 && tab === 'works') || (i === 1 && tab === 'pages')));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

// --- Slug ---
function generateSlug(title) {
  const cleaned = title.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff\s-]/g, '').trim();
  const english = cleaned.replace(/[\u4e00-\u9fff]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  if (english.length >= 3) return english;
  const d = new Date();
  const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `${ds}-work`;
}

// --- Parse Front Matter ---
function parseFrontMatter(content) {
  const m = content.match(/^---\s*\n([\s\S]*?)\n---/);
  if (!m) return { frontMatter: {}, body: content };
  const fm = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) {
      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();
      if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
        val = val.slice(1, -1);
      }
      fm[key] = val;
    }
  });
  return { frontMatter: fm, body: content.slice(m[0].length) };
}

function buildFileContent(title, date, body) {
  const fmLines = ['---', `title: "${title.replace(/"/g, '\\"')}"'];
  if (date) fmLines.push(`date: ${date}`);
  fmLines.push('---');
  return fmLines.join('\n') + '\n' + body;
}

// --- Works ---
async function loadWorks() {
  const container = document.getElementById('worksContainer');
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const res = await api(`${API}/repos/${OWNER}/${REPO}/contents/${WORKS_PATH}?ref=${BRANCH}`);
    const files = await res.json();
    if (!Array.isArray(files)) { container.innerHTML = '<div class="empty-state"><div class="icon">📂</div><p>暂无作品</p></div>'; return; }

    const mdFiles = files.filter(f => f.name.endsWith('.md') && f.name !== '_index.md');
    if (mdFiles.length === 0) { container.innerHTML = '<div class="empty-state"><div class="icon">📂</div><p>暂无作品</p></div>'; return; }

    const items = await Promise.all(mdFiles.map(async f => {
      const r = await api(f.url + `?ref=${BRANCH}`);
      const d = await r.json();
      const content = atob(d.content);
      const { frontMatter } = parseFrontMatter(content);
      return { name: f.name, path: f.path, sha: d.sha, title: frontMatter.title || f.name.replace('.md',''), date: frontMatter.date || '' };
    }));

    items.sort((a, b) => b.date.localeCompare(a.date));
    container.innerHTML = items.map(item => `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-date">${item.date || '无日期'} &middot; ${item.name}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-outline btn-sm" onclick="editWork('${escapeAttr(item.path)}','${escapeAttr(item.name)}')">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="confirmDeleteWork('${escapeAttr(item.path)}','${escapeAttr(item.name)}','${escapeAttr(item.title)}','${escapeAttr(item.sha)}')">删除</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><p>加载失败: ${escapeHtml(e.message)}</p></div>`;
  }
}

function showNewWorkForm() {
  editingFile = null;
  document.getElementById('workFormTitle').textContent = '新建作品';
  document.getElementById('workTitle').value = '';
  document.getElementById('workDate').value = new Date().toISOString().slice(0, 10);
  document.getElementById('workSlug').value = '';
  document.getElementById('workBody').value = '';
  document.getElementById('btnSaveWork').textContent = '保存';
  document.getElementById('worksList').classList.add('hidden');
  document.getElementById('workForm').classList.remove('hidden');
  document.getElementById('workTitle').oninput = function() {
    if (!editingFile) document.getElementById('workSlug').value = generateSlug(this.value);
  };
}

async function editWork(path, name) {
  try {
    const res = await api(`${API}/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`);
    const data = await res.json();
    const content = atob(data.content);
    const { frontMatter, body } = parseFrontMatter(content);
    editingFile = { path, sha: data.sha, name };
    document.getElementById('workFormTitle').textContent = '编辑作品';
    document.getElementById('workTitle').value = frontMatter.title || '';
    document.getElementById('workDate').value = frontMatter.date || '';
    document.getElementById('workSlug').value = name.replace('.md', '');
    document.getElementById('workBody').value = body.trim();
    document.getElementById('btnSaveWork').textContent = '更新';
    document.getElementById('worksList').classList.add('hidden');
    document.getElementById('workForm').classList.remove('hidden');
  } catch (e) {
    toast('加载失败: ' + e.message, 'error');
  }
}

async function saveWork() {
  const title = document.getElementById('workTitle').value.trim();
  const date = document.getElementById('workDate').value;
  let slug = document.getElementById('workSlug').value.trim();
  const body = document.getElementById('workBody').value;

  if (!title) return toast('标题不能为空', 'error');
  if (!slug) slug = generateSlug(title);

  const fileName = slug.endsWith('.md') ? slug : slug + '.md';
  const filePath = editingFile ? editingFile.path : `${WORKS_PATH}/${fileName}`;
  const fileContent = buildFileContent(title, date, body);
  const encoded = btoa(unescape(encodeURIComponent(fileContent)));

  const payload = {
    message: `从后台更新: ${title}`,
    content: encoded,
    branch: BRANCH
  };
  if (editingFile) payload.sha = editingFile.sha;

  try {
    document.getElementById('btnSaveWork').disabled = true;
    await api(`${API}/repos/${OWNER}/${REPO}/contents/${filePath}`, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });
    toast(editingFile ? '作品已更新' : '作品已创建', 'success');
    cancelWorkForm();
    loadWorks();
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  } finally {
    document.getElementById('btnSaveWork').disabled = false;
  }
}

function cancelWorkForm() {
  editingFile = null;
  document.getElementById('worksList').classList.remove('hidden');
  document.getElementById('workForm').classList.add('hidden');
}

// --- Delete ---
function confirmDeleteWork(path, name, title, sha) {
  pendingDelete = { path, name, sha };
  document.getElementById('deleteMessage').textContent = `确定要删除「${title}」吗？此操作不可撤销。`;
  document.getElementById('deleteModal').classList.remove('hidden');
  document.getElementById('btnConfirmDelete').onclick = deleteWork;
}

function closeDeleteModal() {
  pendingDelete = null;
  document.getElementById('deleteModal').classList.add('hidden');
}

async function deleteWork() {
  if (!pendingDelete) return;
  const { path, sha } = pendingDelete;
  try {
    await api(`${API}/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: 'DELETE',
      body: JSON.stringify({ message: `删除作品: ${pendingDelete.name}`, sha, branch: BRANCH })
    });
    toast('已删除', 'success');
    closeDeleteModal();
    loadWorks();
  } catch (e) {
    toast('删除失败: ' + e.message, 'error');
    closeDeleteModal();
  }
}

// --- Pages ---
const PAGES = [
  { path: 'content/_index.md', label: '首页' },
  { path: 'content/about.md', label: '关于' }
];

async function loadPages() {
  const container = document.getElementById('pagesContainer');
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const items = await Promise.all(PAGES.map(async p => {
      const res = await api(`${API}/repos/${OWNER}/${REPO}/contents/${p.path}?ref=${BRANCH}`);
      const data = await res.json();
      const content = atob(data.content);
      const { frontMatter } = parseFrontMatter(content);
      return { ...p, sha: data.sha, title: frontMatter.title || p.label };
    }));
    container.innerHTML = items.map(p => `
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">${escapeHtml(p.label)}</div>
            <div class="card-date">当前标题: ${escapeHtml(p.title)}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-outline btn-sm" onclick="editPage('${escapeAttr(p.path)}','${p.sha}','${escapeAttr(p.label)}')">编辑</button>
          </div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = `<div class="empty-state"><p>加载失败: ${escapeHtml(e.message)}</p></div>`;
  }
}

async function editPage(path, sha, label) {
  try {
    const res = await api(`${API}/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`);
    const data = await res.json();
    const content = atob(data.content);
    const { frontMatter, body } = parseFrontMatter(content);
    currentPage = { path, sha: data.sha, label };
    document.getElementById('pageFormTitle').textContent = '编辑: ' + label;
    document.getElementById('pageTitle').value = frontMatter.title || '';
    document.getElementById('pageBody').value = body.trim();
    document.getElementById('pagePath').value = path;
    document.getElementById('pageSha').value = data.sha;
    document.getElementById('pagesContainer').classList.add('hidden');
    document.getElementById('pageForm').classList.remove('hidden');
  } catch (e) {
    toast('加载失败: ' + e.message, 'error');
  }
}

async function savePage() {
  const title = document.getElementById('pageTitle').value.trim();
  const body = document.getElementById('pageBody').value;
  const path = document.getElementById('pagePath').value;
  const sha = document.getElementById('pageSha').value;
  if (!title) return toast('标题不能为空', 'error');

  const fileContent = buildFileContent(title, '', body);
  const encoded = btoa(unescape(encodeURIComponent(fileContent)));

  try {
    await api(`${API}/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({ message: `从后台更新: ${title}`, content: encoded, sha, branch: BRANCH })
    });
    toast('页面已更新', 'success');
    cancelPageForm();
    loadPages();
  } catch (e) {
    toast('保存失败: ' + e.message, 'error');
  }
}

function cancelPageForm() {
  currentPage = null;
  document.getElementById('pagesContainer').classList.remove('hidden');
  document.getElementById('pageForm').classList.add('hidden');
}

// --- Helpers ---
function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function escapeAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
