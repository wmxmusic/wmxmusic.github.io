{{ define "main" }}
<article class="single-post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ with .Date }}
    <time class="post-date">{{ .Format "2006-01-02" }}</time>
    {{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <footer class="post-footer">
    <a class="btn-back" href="{{ "works/" | relURL }}">&larr; 返回作品集</a>
  </footer>
</article>
{{ end }}
