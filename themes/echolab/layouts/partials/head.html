<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-deep: #07070d; --bg-surface: #0f0f18; --bg-card: #151523;
    --bg-card-hover: #1c1c30; --text-primary: #ececf2; --text-secondary: #a8a8c0;
    --text-muted: #6a6a80; --ai-accent: #a855f7; --ai-glow: #c084fc;
    --original-accent: #f59e0b; --original-glow: #fbbf24; --video-accent: #06b6d4;
    --video-glow: #22d3ee; --gold: #f0b90b;
    --border-subtle: rgba(255,255,255,0.07); --border-medium: rgba(255,255,255,0.12);
    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px;
    --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
    --font-logo: 'Space Grotesk', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-width:320px;}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0.5;}

.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(8,8,14,0.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border-subtle);}
.nav-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 1.5rem;}
.nav-logo{font-family:var(--font-logo);font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#c084fc,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;white-space:nowrap;}
.nav-links{display:flex;list-style:none;gap:0.2rem;align-items:center;flex-wrap:wrap;}
.nav-links a{background:transparent;border:none;color:var(--text-secondary);padding:0.5rem 0.9rem;border-radius:30px;font-size:0.85rem;font-weight:500;cursor:pointer;font-family:inherit;transition:var(--transition);white-space:nowrap;text-decoration:none;}
.nav-links a:hover,.nav-links a.active-page{background:rgba(255,255,255,0.06);color:white;}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;z-index:101;padding:8px;}
.hamburger span{width:24px;height:2.5px;background:#e8e8f0;border-radius:4px;transition:0.3s;display:block;}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.active span:nth-child(2){opacity:0;}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.nav-links.open{display:flex!important;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:rgba(8,8,14,0.95);backdrop-filter:blur(18px);padding:1rem;gap:0.5rem;border-bottom:1px solid var(--border-subtle);}
main{position:relative;z-index:2;min-height:100vh;padding-top:80px;animation:fadeInPage 0.5s ease;overflow:hidden;}
@keyframes fadeInPage{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.page-home main{background:radial-gradient(ellipse at 25% 15%,rgba(124,58,237,0.12) 0%,transparent 55%),radial-gradient(ellipse at 75% 30%,rgba(245,158,11,0.08) 0%,transparent 50%),radial-gradient(ellipse at 40% 70%,rgba(6,182,212,0.07) 0%,transparent 50%),radial-gradient(ellipse at 60% 85%,rgba(168,85,247,0.06) 0%,transparent 45%),linear-gradient(180deg,#08080f 0%,#0a0a14 30%,#0c0c18 60%,#08080f 100%);}
.page-home main::before{content:'';position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;border-radius:50%;border:1px solid rgba(255,255,255,0.03);box-shadow:0 0 0 60px rgba(192,132,252,0.015),0 0 0 140px rgba(192,132,252,0.01);pointer-events:none;z-index:0;animation:homeRipple 8s ease-in-out infinite;}
@keyframes homeRipple{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7;}50%{transform:translate(-50%,-50%) scale(1.06);opacity:0.4;}}
.page-ai main{background:linear-gradient(rgba(168,85,247,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,0.04) 1px,transparent 1px),radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.18) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(168,85,247,0.1) 0%,transparent 45%),linear-gradient(170deg,#08071a 0%,#0a0820 30%,#0c0a1e 60%,#08071a 100%);background-size:40px 40px,40px 40px,auto,auto,auto;}
.page-ai main::before{content:'';position:absolute;top:10%;right:5%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.12) 0%,transparent 70%);pointer-events:none;z-index:0;animation:aiPulse 4s infinite;}
.page-ai main::after{content:'';position:absolute;bottom:10%;left:5%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.1) 0%,transparent 70%);pointer-events:none;z-index:0;animation:aiPulse 4s 1.5s infinite;}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.25);opacity:0.35;}}
.page-original main{background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(245,158,11,0.025) 28px,rgba(245,158,11,0.025) 30px),radial-gradient(ellipse at 25% 30%,rgba(217,119,6,0.13) 0%,transparent 50%),radial-gradient(ellipse at 70% 65%,rgba(245,158,11,0.09) 0%,transparent 50%),linear-gradient(175deg,#0d0a06 0%,#0f0c08 30%,#0e0b07 60%,#0a0805 100%);}
.page-original main::before{content:'';position:absolute;top:10%;left:3%;width:2px;height:50%;background:linear-gradient(to bottom,transparent,rgba(245,158,11,0.25) 15%,rgba(245,158,11,0.3) 50%,rgba(245,158,11,0.2) 85%,transparent);pointer-events:none;z-index:0;border-radius:2px;box-shadow:20px 0 0 rgba(245,158,11,0.08),40px 0 0 rgba(245,158,11,0.05);animation:stringVibrate 3s infinite;}
@keyframes stringVibrate{0%,100%{transform:translateX(0);}25%{transform:translateX(1px);}75%{transform:translateX(-1px);}}
.page-video main,.page-videos main{background:repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(6,182,212,0.04) 48px,rgba(6,182,212,0.04) 52px),radial-gradient(ellipse at 30% 25%,rgba(6,182,212,0.14) 0%,transparent 50%),radial-gradient(ellipse at 65% 60%,rgba(34,211,238,0.08) 0%,transparent 50%),linear-gradient(170deg,#060f12 0%,#081114 30%,#071013 60%,#050c0e 100%);}
.page-video main::before,.page-videos main::before{content:'b965';position:absolute;top:50%;right:3%;transform:translateY(-50%);font-size:10rem;color:rgba(6,182,212,0.03);pointer-events:none;z-index:0;font-family:sans-serif;animation:playFloat 6s infinite;}
@keyframes playFloat{0%,100%{transform:translateY(-50%) scale(1);opacity:0.5;}50%{transform:translateY(-52%) scale(1.06);opacity:0.3;}}
.page-about main{background:radial-gradient(ellipse at 35% 40%,rgba(255,255,255,0.04) 0%,transparent 55%),radial-gradient(ellipse at 65% 55%,rgba(192,132,252,0.05) 0%,transparent 50%),linear-gradient(180deg,#0b0b14 0%,#0d0d18 30%,#0c0c16 60%,#0a0a12 100%);}
.page-about main::before{content:'';position:absolute;top:20%;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;}
.container{max-width:1200px;margin:0 auto;padding:1.5rem 1.5rem 3rem;position:relative;z-index:1;}
.featured-section{margin-top:2rem;padding:0 1.5rem 2rem;position:relative;z-index:1;}
.page-badge{display:inline-block;padding:0.25rem 1rem;border-radius:30px;font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.8rem;}
.page-title{font-family:var(--font-logo);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;letter-spacing:-0.02em;margin-bottom:0.5rem;}
.page-desc{color:var(--text-secondary);font-size:0.95rem;margin-bottom:2rem;max-width:600px;}
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;margin-bottom:2.5rem;}
.work-card{display:block;background:var(--bg-card);border-radius:var(--radius-md);padding:1.5rem 1.2rem;text-decoration:none;transition:var(--transition);border:1px solid var(--border-subtle);position:relative;overflow:hidden;cursor:pointer;}
.work-card:hover{transform:translateY(-4px);background:var(--bg-card-hover);border-color:var(--border-medium);box-shadow:0 12px 40px rgba(0,0,0,0.3);}
.cover-art{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1rem;}
.ai-cover{background:linear-gradient(135deg,rgba(168,85,247,0.25),rgba(99,102,241,0.15));}
.original-cover{background:linear-gradient(135deg,rgba(245,158,11,0.25),rgba(217,119,6,0.15));}
.video-cover{background:linear-gradient(135deg,rgba(6,182,212,0.25),rgba(14,165,233,0.15));}
.work-card h3{font-size:1.05rem;font-weight:600;margin-bottom:0.3rem;color:var(--text-primary);}
.work-card .meta{font-size:0.8rem;color:var(--text-muted);}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center;}
.modal.active{display:flex;}
.modal-content{background:var(--bg-card);border-radius:var(--radius-lg);padding:2.5rem 2rem;max-width:420px;width:90%;text-align:center;position:relative;border:1px solid var(--border-medium);}
.close-modal{position:absolute;top:0.8rem;right:1rem;font-size:1.5rem;color:var(--text-muted);cursor:pointer;background:none;border:none;}
.cert-recipient{font-size:1.3rem;font-weight:700;color:var(--gold);margin:1rem 0 0.5rem;}
.modal-seal{display:inline-block;margin-top:1rem;padding:0.4rem 1.5rem;border:2px solid var(--gold);border-radius:30px;color:var(--gold);font-size:0.8rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
.work-single img{max-width:100%;border-radius:var(--radius-md);}
.footer-record{text-align:center;color:var(--text-muted);font-size:0.8rem;padding:2rem 0;position:relative;z-index:2;}

@media(max-width:1024px){
.works-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.nav-links a{font-size:0.8rem;padding:0.4rem 0.7rem;}
}
@media(max-width:768px){
.nav-links{display:none;}
.hamburger{display:flex;}
.container{padding:1rem 1rem 3rem;}
.featured-section{padding:0 1rem 2rem;}
.works-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
.page-title{font-size:1.6rem;}
.work-card{padding:1.2rem 1rem;}
.nav-inner{padding:0 1rem;}
}
@media(max-width:640px){
.works-grid{grid-template-columns:1fr;}
.page-home main::before{width:300px;height:300px;}
}
@media(max-width:480px){
.nav-logo{font-size:1.3rem;}
.container{padding:0.8rem;}
.featured-section{padding:0 0.5rem 2rem;}
.work-card{padding:1rem 0.8rem;}
}
</style>
