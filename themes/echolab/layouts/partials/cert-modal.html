<div id="certModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeCertModal()">&times;</span>
        <h2>获奖证书</h2>
        <div id="certCompetition"></div>
        <div class="cert-recipient" id="certWork"></div>
        <div id="certAward"></div>
        <div id="certDate"></div>
        <div class="modal-seal">认证</div>
    </div>
</div>
<script>
function openCertModal(work, competition, award, date) {
    document.getElementById('certWork').textContent = work;
    document.getElementById('certCompetition').textContent = competition;
    document.getElementById('certAward').textContent = award;
    document.getElementById('certDate').textContent = date;
    document.getElementById('certModal').classList.add('active');
}
function closeCertModal() {
    document.getElementById('certModal').classList.remove('active');
}
document.getElementById('certModal').addEventListener('click', function(e) {
    if (e.target === this) closeCertModal();
});
</script>
